user www-data;

worker_processes auto;

events {
    use epoll;
    worker_connections 1024;
}

http {

    # MIME types
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format  main  '[$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;
    error_log /var/log/nginx/error.log;

    # Charset
    charset utf-8;

    # Max body size and buffer
    client_max_body_size 512M;
    client_body_buffer_size 128k;

    # Emit nginx version on error pages and in the “Server” response header field.
    server_tokens off;

    # Directory listing output
    autoindex off;

    # File I/O & TCP tuning
    sendfile on;
    sendfile_max_chunk 2m;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 1000;

    # Cache file descriptors & stat() metadata in RAM
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Force browser XSS protection
    add_header X-XSS-Protection "1; mode=block";

    # Turn gzip off
    # We should gzip on the reverse proxy instead
    gzip off;

    # Trust Caddy reverse proxy (loopback + Docker networks)
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from fc00::/7;
    set_real_ip_from fe80::/10;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # App server
    server {

        # Listen
        listen 80;
        server_name localhost;

        # Project root
        root   /app/www/public;
        index  index.php;

        #================================================================
        # Special location rules
        #================================================================

        # Healthcheck
        # cSpell:disable-next-line
        location /healthz {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        #================================================================
        # Specific cache rules
        #================================================================

        # Cache assets
        location ~ ^/(img|js|css|font|screenshots)/ {
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # Cache favicon
        location /favicon.ico {
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        #================================================================
        # Internal location rules
        #================================================================

        # Workshop internal downloads
        location ~ ^/workshop/internal-download/([0-9]+)/(.+)$ {
            internal; # Prevents direct public access
            access_log off;
            alias /app/storage/workshop/$1/files/$2;
        }

        #================================================================
        # Location rules
        #================================================================

        # Workshop images
        location ~ ^/workshop/image/([0-9]+)/(.+)$ {
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            alias /app/storage/workshop/$1/images/$2;
        }

        # Avatars
        location ~ ^/avatar/(.+)$ {
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            alias /app/storage/avatar/$1;
        }

        # News images
        location ~ ^/news/image/(.+)$ {
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            alias /app/storage/news-img/$1;
        }

        # Crash report savefiles
        location ~ ^/dev/crash-report/download/(.+)$ {
            add_header Content-disposition "attachment; filename=$1";
            alias /app/storage/crash-report/savefiles/$1;
        }

        # Alpha patches
        location ~ ^/download/alpha/(.+)$ {
            add_header Content-disposition "attachment; filename=$1";
            alias /app/storage/alpha-patch/$1;
        }

        # Prototypes
        location ~ ^/download/prototype/(.+)$ {
            add_header Content-disposition "attachment; filename=$1";
            alias /app/storage/prototype/$1;
        }

        # Web Uploads
        location ~ ^/uploads/(.+)$ {
            add_header Content-disposition "attachment; filename=$1";
            alias /app/storage/upload/$1;
        }

        # Game Files
        location ~ ^/game-files/download/([a-z]+)/([0-9\.]+)/(.+)$ {
            access_log off;
            add_header Content-disposition "attachment; filename=$args";
            alias /app/storage/game-files/$1/$2/$3;
        }

        # Speedtest files
        location ~ ^/speedtest/(.+)$ {

            # Force file as download
            add_header Content-disposition "attachment; filename=$1";

            # Disable cache
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
            add_header Pragma "no-cache";

            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
        }

        #================================================================
        # Routing
        #================================================================

        # Check if file path is directly accessible
        # Route the rest trough the PHP router
        location / {
            # try_files $uri /app/www/public/index.php$is_args$args;
            try_files $uri /index.php$is_args$args;
        }

        # PHP scripts
        location ~ \.php$ {

            # Pass to PHP container
            fastcgi_pass unix:/var/run/php/php-fpm.sock;

            # Loads standard CGI environment variables (REQUEST_METHOD, QUERY_STRING, REMOTE_ADDR, etc.)
            # from /etc/nginx/fastcgi_params so PHP can populate $_SERVER.
            include fastcgi_params;

            # Hardcodes the exact PHP entrypoint file on the PHP container's filesystem.
            # NOTE: Must come AFTER `include fastcgi_params`
            fastcgi_param SCRIPT_FILENAME /app/www/public/index.php;

            # Stream uploads directly to PHP without writing twice to disk
            fastcgi_request_buffering off;

            # Buffers & timeouts aligned with PHP max_execution_time = 60
            fastcgi_buffer_size 128k;
            fastcgi_buffers 8 256k;
            fastcgi_busy_buffers_size 256k;
            fastcgi_read_timeout 65s;
            fastcgi_send_timeout 65s;
        }
    }
}
